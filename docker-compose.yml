services:
  postgres:
    image: postgres:16-alpine
    container_name: invoice-tracker-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice_tracker
    volumes:
      - invoice_tracker_pgdata:/var/lib/postgresql/data

volumes:
  invoice_tracker_pgdata:
